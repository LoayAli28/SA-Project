services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  # --- DATABASES ---
  user-db:
    image: mongo:4.4
    platform: linux/amd64
    networks:
      - app-network

  event-db:
    image: mongo:4.4
    platform: linux/amd64
    networks:
      - app-network

  ticket-db:
    image: mongo:4.4
    platform: linux/amd64
    networks:
      - app-network

  notification-db:
    image: mongo:4.4
    platform: linux/amd64
    networks:
      - app-network

  # --- MICROSERVICES ---

  user-service:
    build: ./event-backend/user-service
    ports:
      - "3002:3000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://user-db:27017/users
    depends_on:
      kafka:
        condition: service_healthy
      user-db:
        condition: service_started
    networks:
      - app-network

  ticket-service:
    build: ./event-backend/ticket-service
    ports:
      - "3003:3000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://ticket-db:27017/tickets
    depends_on:
      kafka:
        condition: service_healthy
      ticket-db:
        condition: service_started
      user-db:
        condition: service_started
    networks:
      - app-network

  event-service:
    build: ./event-backend/event-service
    ports:
      - "3004:3000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://event-db:27017/events
    depends_on:
      kafka:
        condition: service_healthy
      event-db:
        condition: service_started
    networks:
      - app-network

  notification-service:
    build: ./event-backend/notification-service
    ports:
      - "3005:3000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://notification-db:27017/notifications
    depends_on:
      kafka:
        condition: service_healthy
      notification-db:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge